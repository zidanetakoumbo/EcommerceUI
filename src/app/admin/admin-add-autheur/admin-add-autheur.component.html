<div class="container-fluid py-4 px-4">
  <div class="row mb-4 align-items-center">
    <div class="col">
      <h2 class="display-6 fw-bold text-primary">
        {{ isEditMode ? 'Modifier un auteur' : 'Ajouter un auteur' }}
      </h2>
      <p class="text-muted mb-0">Remplissez les informations de l'auteur.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form [formGroup]="autheurForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Nom</label>
          <input formControlName="nom" type="text" class="form-control" placeholder="Nom de l'auteur" />
          <div *ngIf="autheurForm.get('nom')?.invalid && autheurForm.get('nom')?.touched" class="text-danger mt-1 small">
            Le nom doit comporter au moins 2 caractères.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Prénom</label>
          <input formControlName="prenom" type="text" class="form-control" placeholder="Prénom de l'auteur" />
          <div *ngIf="autheurForm.get('prenom')?.invalid && autheurForm.get('prenom')?.touched" class="text-danger mt-1 small">
            Le prénom doit comporter au moins 2 caractères.
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" [disabled]="autheurForm.invalid" class="btn btn-primary px-4">
            {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
          </button>
          <button type="button" class="btn btn-secondary px-4" (click)="onCancel()">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
