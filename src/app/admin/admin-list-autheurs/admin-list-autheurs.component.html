<div class="container-fluid py-4 px-4">
  <div class="row mb-4 align-items-center">
    <div class="col">
      <h2 class="display-6 fw-bold text-primary">Gestion des Auteurs</h2>
      <p class="text-muted mb-0">Ajoutez, modifiez ou supprimez des auteurs.</p>
    </div>
    <div class="col-auto">
      <a routerLink="/admin/autheurs/add" class="btn btn-success shadow-sm px-4">
        <i class="bi bi-plus-circle me-2"></i>Nouveau Auteur
      </a>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <div class="input-group mb-3">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
        <input
          type="text"
          class="form-control border-start-0"
          placeholder="Rechercher un auteur..."
          [(ngModel)]="recherche"
          (input)="appliquerFiltre()"
        />
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-primary">
            <tr>
              <th class="ps-4">Nom</th>
              <th>Prénom</th>
              <th class="text-center">Livres</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let autheur of autheursFiltres.slice().reverse()">
              <td class="ps-4">
                <div class="fw-bold text-dark">{{ autheur.nom }}</div>
              </td>
              <td>
                <div class="text-muted small">{{ autheur.prenom }}</div>
              </td>
              <td class="text-center">
                <span class="badge bg-light text-dark border">{{ autheur.livres?.length || 0 }}</span>
              </td>
              <td class="text-center">
                <div class="btn-group gap-2">
                  <a [routerLink]="['/admin/autheurs/update', autheur.id]" class="btn btn-outline-primary btn-sm rounded shadow-sm px-3" title="Modifier cet auteur">
                    <i class="bi bi-pencil-square"></i>
                  </a>
                  <button class="btn btn-outline-danger btn-sm rounded" (click)="supprimerAutheur(autheur.id!)" title="Supprimer">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div *ngIf="autheursFiltres.length === 0" class="alert alert-info mt-4 text-center border-0 shadow-sm">
    <i class="bi bi-info-circle me-2"></i>
    Aucun auteur ne correspond à votre recherche.
  </div>
</div>
