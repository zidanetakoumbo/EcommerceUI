<!-- ===== BARRE LATÉRALE ADMINISTRATION ===== -->
<div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark admin-sidebar">

  <!-- Logo / Titre de la section admin -->
  <a routerLink="/admin/dashboard"
     class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
    <i class="bi bi-shield-lock-fill me-2 fs-4"></i>
    <span class="fs-4 fw-bold">Administration</span>
  </a>

  <hr>

  <!-- Navigation principale -->
  <ul class="nav nav-pills flex-column mb-auto">

    <!-- Dashboard -->
    <li class="nav-item">
      <!--
        routerLinkActive="active" : Angular ajoute automatiquement la classe "active"
        quand l'URL du navigateur correspond à ce lien.
        Le CSS de la sidebar applique alors un fond bleu sur le lien actif.
      -->
      <a routerLink="/admin/dashboard"
         routerLinkActive="active"
         class="nav-link text-white">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
      </a>
    </li>

    <!-- Gestion des livres -->
    <li>
      <a routerLink="/admin/livres/list"
         routerLinkActive="active"
         class="nav-link text-white">
        <i class="bi bi-book me-2"></i>
        Gestion Livres
      </a>
    </li>

    <!-- Gestion des auteurs -->
    <li>
      <a routerLink="/admin/autheurs/list"
         routerLinkActive="active"
         class="nav-link text-white">
        <i class="bi bi-person-badge me-2"></i>
        Gestion Auteurs
      </a>
    </li>

    <!-- Gestion des catégories -->
    <li>
      <a routerLink="/admin/categories"
         routerLinkActive="active"
         class="nav-link text-white">
        <i class="bi bi-tags me-2"></i>
        Catégories
      </a>
    </li>

    <!-- Gestion des commandes -->
    <li>
      <a routerLink="/admin/commandes"
         routerLinkActive="active"
         class="nav-link text-white">
        <i class="bi bi-cart-check me-2"></i>
        Commandes
      </a>
    </li>

  </ul>

  <hr>

  <!-- Menu utilisateur (dropdown en bas de la sidebar) -->
  <div class="dropdown">
    <!--
      data-bs-toggle="dropdown" : Bootstrap ouvre/ferme le menu au clic.
      Le "?" après username?.charAt(0) évite une erreur si username est null.
    -->
    <a href="#"
       class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
       id="dropdownAdmin"
       data-bs-toggle="dropdown"
       aria-expanded="false">
      <!-- Avatar avec la première lettre du prénom (au lieu d'une image fixe) -->
      <div class="avatar-initiales me-2">
        {{ username?.charAt(0)?.toUpperCase() || 'A' }}
      </div>
      <!-- CORRECTION : était "uu" en dur — maintenant on affiche le vrai prénom -->
      <strong>{{ username || 'Administrateur' }}</strong>
    </a>

    <!-- Menu déroulant -->
    <ul class="dropdown-menu dropdown-menu-dark text-small shadow"
        aria-labelledby="dropdownAdmin">
      <li>
        <!-- Lien vers le profil utilisateur (même page que les clients) -->
        <a class="dropdown-item" routerLink="/profil">
          <i class="bi bi-person me-2"></i>Mon profil
        </a>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <!--
          (click)="logout()" appelle la méthode logout() du composant TypeScript.
          cursor: pointer; nécessaire car c'est un <a> sans href réel.
        -->
        <a class="dropdown-item text-danger" (click)="logout()" style="cursor: pointer;">
          <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
        </a>
      </li>
    </ul>
  </div>

</div>
